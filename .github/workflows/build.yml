name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Build Libbox.xcframework (sing-box v1.11.15)
        run: |
          git clone --depth 1 --branch v1.11.15 https://github.com/SagerNet/sing-box /tmp/singbox
          cd /tmp/singbox
          go get golang.org/x/mobile@latest
          go install golang.org/x/mobile/cmd/gomobile@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
          gomobile init
          gomobile bind \
            -target ios,iossimulator \
            -tags "with_gvisor,with_quic,with_wireguard,with_utls" \
            -o /tmp/Libbox.xcframework \
            ./experimental/libbox
          mkdir -p "$GITHUB_WORKSPACE/iosApp/Frameworks"
          rm -rf "$GITHUB_WORKSPACE/iosApp/Frameworks/Libbox.xcframework"
          cp -R /tmp/Libbox.xcframework "$GITHUB_WORKSPACE/iosApp/Frameworks/"
          ls -la "$GITHUB_WORKSPACE/iosApp/Frameworks/Libbox.xcframework"

      - name: Dump Libbox API (headers)
        if: always()
        run: |
          set +e
          HEADER=iosApp/Frameworks/Libbox.xcframework/ios-arm64/Libbox.framework/Headers/Libbox.h
          echo "===== gomobile version ====="
          (cd /tmp/singbox && go list -m golang.org/x/mobile) || true
          echo "===== xcframework tree ====="
          find "$GITHUB_WORKSPACE/iosApp/Frameworks/Libbox.xcframework" | head -50
          echo "===== all headers ====="
          find "$GITHUB_WORKSPACE/iosApp/Frameworks/Libbox.xcframework" -name "*.h" -o -name "*.modulemap" | while read -r H; do
            echo "--- $H"; grep -nE "@protocol|^@interface Libbox" "$H" | head -30
          done
          HEADER=$(find "$GITHUB_WORKSPACE/iosApp/Frameworks/Libbox.xcframework/ios-arm64" -name "*.h" | head -1)
          echo "===== using header: $HEADER ====="
          echo "===== header overview ====="
          grep -nE "@protocol|@interface Libbox" "$HEADER" | head -60
          echo "===== PlatformInterface full ====="
          awk "/LibboxPlatformInterface/,/^@end/" "$HEADER" | head -80
          echo "===== TunOptions full ====="
          awk "/LibboxTunOptions/,/^@end/" "$HEADER" | head -60
          echo "===== Notification / StringBox / SetupOptions ====="
          awk "/LibboxNotification /,/^@end/" "$HEADER" | head -40
          awk "/LibboxStringBox /,/^@end/" "$HEADER" | head -20
          awk "/LibboxSetupOptions /,/^@end/" "$HEADER" | head -30
          echo "===== functions ====="
          grep -E "Libbox(NewService|Setup|SetMemoryLimit|GetTunnelFileDescriptor)" "$HEADER" || true
          cp "$HEADER" /tmp/Libbox-dump.h || true

      - name: Build Kotlin/Compose framework (iosArm64)
        run: |
          chmod +x gradlew
          ./gradlew :shared:linkReleaseFrameworkIosArm64 --no-daemon --stacktrace

      - name: Copy framework into Xcode project
        run: |
          mkdir -p iosApp/Frameworks
          rm -rf iosApp/Frameworks/Shared.framework
          cp -R shared/build/bin/iosArm64/releaseFramework/Shared.framework iosApp/Frameworks/

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd iosApp
          xcodegen generate

      - name: Build unsigned app
        run: |
          cd iosApp
          xcodebuild -project Zefir.xcodeproj \
            -scheme Zefir \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package into .ipa
        run: |
          cd iosApp
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "App: $APP"
          mkdir -p dist/Payload
          cp -R "$APP" dist/Payload/
          cd dist
          zip -qry Zefir.ipa Payload
          ls -la Zefir.ipa

      - name: Sign with macOS codesign (factory-grade signature)
        env:
          ZEFIR_P12_B64: ${{ secrets.ZEFIR_P12_B64 }}
          ZEFIR_P12_PASS: ${{ secrets.ZEFIR_P12_PASS }}
          ZEFIR_PROV_B64: ${{ secrets.ZEFIR_PROV_B64 }}
        run: |
          set -e
          CERT_NAME="Zefir CI"
          KEYCHAIN=build.keychain-db
          security create-keychain -p travis "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p travis "$KEYCHAIN"
          echo "$ZEFIR_P12_B64" | base64 -d > cert.p12
          security import cert.p12 -k "$KEYCHAIN" -P "$ZEFIR_P12_PASS" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k travis "$KEYCHAIN" >/dev/null
          rm cert.p12

          IDENTITY="iPhone Distribution: Narayan Adhikari (4P2MX93T2D)"
          security find-identity -v -p codesigning "$KEYCHAIN" || true

          cd iosApp/dist
          rm -rf Payload
          unzip -q Zefir.ipa

          # профиль в главный бандл
          echo "$ZEFIR_PROV_B64" | base64 -d > Payload/Zefir.app/embedded.mobileprovision

          # фреймворки -> appex -> главный бинарник (в порядке вложенности)
          codesign --force --sign "$IDENTITY" --timestamp=none Payload/Zefir.app/PlugIns/ZefirTunnel.appex/Frameworks/Libbox.framework
          codesign --force --sign "$IDENTITY" --entitlements "$GITHUB_WORKSPACE/signing/ZefirTunnel.entitlements" --timestamp=none Payload/Zefir.app/PlugIns/ZefirTunnel.appex
          codesign --force --sign "$IDENTITY" --entitlements "$GITHUB_WORKSPACE/signing/Zefir.entitlements" --timestamp=none Payload/Zefir.app

          codesign --verify --deep --strict --verbose=2 Payload/Zefir.app || true
          rm -f Zefir-codesigned.ipa
          zip -qry Zefir-codesigned.ipa Payload
          ls -la Zefir-codesigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Zefir-ipa
          path: iosApp/dist/Zefir.ipa
          if-no-files-found: error

      - name: Upload codesigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Zefir-ipa-codesigned
          path: iosApp/dist/Zefir-codesigned.ipa
          if-no-files-found: error

      - name: Upload Libbox header
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: libbox-header
          path: /tmp/Libbox-dump.h
          if-no-files-found: ignore
