name: Zefir
options:
  bundleIdPrefix: app.ziziphus6793
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: 1.1.5
    CURRENT_PROJECT_VERSION: 3
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGNING_ALLOWED: NO

targets:
  Zefir:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - "Tunnel/**"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.ziziphus6793.squirrel5564
        PRODUCT_NAME: Zefir
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Sources/Info.plist
        FRAMEWORK_SEARCH_PATHS: $(inherited) $(SRCROOT)/Frameworks
        OTHER_LDFLAGS: $(inherited) -framework Shared
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/Frameworks
    dependencies:
      - framework: Frameworks/Shared.framework
        embed: false
        link: true
      - target: ZefirTunnel
        embed: true

  ZefirTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Tunnel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.ziziphus6793.squirrel5564.ZefirTunnel
        PRODUCT_NAME: ZefirTunnel
        INFOPLIST_FILE: Sources/Tunnel/Info.plist
        FRAMEWORK_SEARCH_PATHS: $(inherited) $(SRCROOT)/Frameworks
        OTHER_LDFLAGS: $(inherited) -framework Libbox
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/Frameworks
    dependencies:
      - framework: Frameworks/Libbox.xcframework
        embed: true
